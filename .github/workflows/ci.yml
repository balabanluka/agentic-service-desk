name: Offline validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: python -m pytest
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Check installed dependencies
        run: python -m pip check
      - name: Validate frozen evaluation data
        run: python -m service_desk.evaluation.run validate
      - name: Run offline V3 action evaluation
        run: python -m service_desk.evaluation.run action-offline --split development
      - name: Build wheel
        run: python -m build --wheel
